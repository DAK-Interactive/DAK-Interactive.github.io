<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Item Archive — DAK Interactive</title>
<style>
  :root {
    --bg: #f5f7fa;
    --fg: #0b111e;
    --muted: #5b6472;
    --card: #ffffff;
    --border: #e3e7ee;
    --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b111e;
      --fg: #f5f7fa;
      --muted: #9aa4b2;
      --card: #121a2b;
      --border: #212b3e;
      --accent: #5b9dff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  .card {
    max-width: 440px;
    width: 100%;
    text-align: center;
  }
  .icon {
    width: 72px;
    height: 72px;
    border-radius: 20px;
    border: 2px solid var(--fg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    margin: 0 auto 20px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 8px;
  }
  p.tagline {
    color: var(--muted);
    font-size: 15px;
    line-height: 1.5;
    margin: 0 0 28px;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  a.btn {
    display: block;
    padding: 13px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--fg);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: opacity 0.15s;
  }
  a.btn:active { opacity: 0.7; }
  a.btn.primary {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
  }
  footer {
    margin-top: 32px;
    font-size: 12px;
    color: var(--muted);
  }
  footer a { color: var(--muted); }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📦</div>
    <h1>Item Archive</h1>
    <p class="tagline">
      Organize your home inventory, storage, and items offline with ease.
      100% Private — No Accounts, No Servers.
    </p>
    <div class="links">
      <a class="btn primary" href="https://play.google.com/store/apps/details?id=com.itemarchive.app">
        Get It On Google Play
      </a>
      <a class="btn" href="https://gist.github.com/PhisoQ/4029fca2f7769a6afa818fb4ef752775">
        Privacy Policy
      </a>
      <a class="btn" href="mailto:dakinteractive@gmail.com">
        Contact Us
      </a>
    </div>
    <footer>
      DAK Interactive · <a href="mailto:dakinteractive@gmail.com">dakinteractive@gmail.com</a>
    </footer>
  </div>
</body>
</html>
