<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Item Archive — DAK Interactive</title>
<style>
  :root {
    --bg: #f5f7fa;
    --fg: #0b111e;
    --muted: #5b6472;
    --card: #ffffff;
    --border: #e3e7ee;
    --accent: #2563eb;
    --pill-bg: #eef2f8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b111e;
      --fg: #f5f7fa;
      --muted: #9aa4b2;
      --card: #121a2b;
      --border: #212b3e;
      --accent: #5b9dff;
      --pill-bg: #182238;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  .card {
    max-width: 480px;
    width: 100%;
    text-align: center;
    animation: fadeIn 0.4s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .icon-wrap {
    width: 84px;
    height: 84px;
    border-radius: 22px;
    margin: 0 auto 20px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    background: #0b111e;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .icon-fallback {
    font-size: 36px;
    line-height: 1;
  }
  h1 {
    font-size: 23px;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .by {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 16px;
  }
  p.tagline {
    color: var(--muted);
    font-size: 15px;
    line-height: 1.55;
    margin: 0 auto 18px;
    max-width: 360px;
    text-wrap: balance;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--pill-bg);
    color: var(--muted);
    font-size: 12px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 999px;
    margin-bottom: 28px;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  a.btn {
    display: block;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--fg);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: transform 0.12s, opacity 0.12s;
  }
  a.btn:active { opacity: 0.7; transform: scale(0.98); }
  a.btn.primary {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
  }
  footer {
    margin-top: 28px;
    font-size: 12px;
    color: var(--muted);
  }
  footer a {
    color: var(--muted);
    text-decoration: none;
  }
  footer a:hover { color: var(--accent); }
</style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <img
        src="icon-only.png"
        alt=""
        onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
      />
      <span class="icon-fallback" style="display:none; width:100%; height:100%; align-items:center; justify-content:center;">📦</span>
    </div>
    <h1>Item Archive</h1>
    <p class="by">By DAK Interactive</p>
    <p class="tagline">
      Organize your home inventory, storage, and items offline with ease.
    </p>
    <div class="pill">🔒 100% Private &amp; Offline</div>
    <div class="links">
      <a class="btn primary" href="https://play.google.com/store/apps/details?id=com.itemarchive.app">
        Get It On Google Play
      </a>
      <a class="btn" href="https://dak-interactive.github.io/Item-Archive-Privacy-Policy/">
        Privacy Policy
      </a>
      <a class="btn" href="mailto:dakinteractive@gmail.com">
        Contact Us
      </a>
    </div>
    <footer>
      © DAK Interactive · <a href="mailto:dakinteractive@gmail.com">dakinteractive@gmail.com</a>
    </footer>
  </div>
</body>
</html>
